<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title>Berserk Rush - Items Showcase</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }
        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 200px rgba(0,0,0,0.9);
            pointer-events: none;
            z-index: 5;
        }
        .items-bg {
            position: absolute;
            top: -20%;
            left: -20%;
            width: 140%;
            height: 140%;
            background: #000;
            overflow: hidden;
            display: flex;
            gap: 20px;
            justify-content: center;
            opacity: 0.85;
            transform: rotate(10deg);
        }
        .item-column {
            display: flex;
            flex-direction: column;
        }
        .item-group {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 20px;
            animation: scroll-up 8s linear infinite;
        }
        .item-column:nth-child(even) .item-group {
            animation: scroll-down 10s linear infinite;
        }
        .item-icon {
            width: 100px;
            height: 100px;
            border: 2px solid #555;
            border-radius: 10px;
            background: rgba(0,0,0,0.8);
            object-fit: contain;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
        }
        @keyframes scroll-up {
            from { transform: translateY(0); }
            to { transform: translateY(-100%); }
        }
        @keyframes scroll-down {
            from { transform: translateY(-100%); }
            to { transform: translateY(0); }
        }
    </style>
</head>

        function createItemsScroll() {
            const bg = document.getElementById('items-bg');

            for (let i = 0; i < 10; i++) {
                const col = document.createElement('div');
                col.className = 'item-column';

                const shuffled = [...itemIcons].sort(() => 0.5 - Math.random()).slice(0, 30);
                const iconsHTML = shuffled
                    .map(item => `<img src="../assets/items/${encodeURIComponent(item)}" class="item-icon" loading="lazy">`)
                    .join('');

                const group1 = document.createElement('div');
                group1.className = 'item-group';
                group1.innerHTML = iconsHTML;
                group1.style.animationDuration = (7 + Math.random() * 5) + 's';

                const group2 = document.createElement('div');
                group2.className = 'item-group';
                group2.innerHTML = iconsHTML;
                group2.style.animationDuration = group1.style.animationDuration;

                col.appendChild(group1);
                col.appendChild(group2);
                bg.appendChild(col);
            }
        }

        createItemsScroll();
